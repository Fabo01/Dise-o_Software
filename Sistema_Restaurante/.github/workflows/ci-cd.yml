# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, backend, frontend ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run migrations
      run: |
        cd Sistema_Restaurante
        python manage.py migrate
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        DJANGO_SETTINGS_MODULE: Backend.Config.Settings.test
    
    - name: Run tests
      run: |
        cd Sistema_Restaurante
        python -m pytest Backend/tests/ -v --cov=Backend --cov-report=xml
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        DJANGO_SETTINGS_MODULE: Backend.Config.Settings.test
    
    - name: Run BDD tests
      run: |
        cd Sistema_Restaurante
        python -m pytest Backend/tests/test_bdd_runner.py -v
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        DJANGO_SETTINGS_MODULE: Backend.Config.Settings.test
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./Sistema_Restaurante/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: Sistema_Restaurante/Frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd Sistema_Restaurante/Frontend
        npm ci
    
    - name: Run tests
      run: |
        cd Sistema_Restaurante/Frontend
        npm run test -- --coverage --watchAll=false
    
    - name: Run lint
      run: |
        cd Sistema_Restaurante/Frontend
        npm run lint
    
    - name: Build application
      run: |
        cd Sistema_Restaurante/Frontend
        npm run build

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        cd Sistema_Restaurante
        bandit -r Backend/ -f json -o bandit-report.json
    
    - name: Run Safety check
      run: |
        cd Sistema_Restaurante
        safety check --json --output safety-report.json
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          Sistema_Restaurante/bandit-report.json
          Sistema_Restaurante/safety-report.json

  deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-audit]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Aquí se implementaría el despliegue real
        # Por ejemplo, a AWS, Heroku, DigitalOcean, etc.
    
    - name: Notify deployment
      run: |
        echo "Deployment completed successfully!"
